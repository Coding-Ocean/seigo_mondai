<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <title>C言語の正誤問題</title>
  <link rel="stylesheet" href="styles.css">
  <script src="questions-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">C LANGUAGE · QUIZ</p>
      <div class="title-row">
        <h1 id="page-title">C言語の正誤問題</h1>
        <span id="set-count" class="set-count" aria-live="polite" hidden></span>
      </div>
      <p class="intro">各問題を読んで、「正」または「誤」を選んでください。</p>
    </header>

    <section class="quiz-panel" aria-labelledby="page-title">
      <div id="status" class="status loading" role="status" aria-live="polite">問題を読み込み中です…</div>

      <ol id="question-list" class="question-list" aria-label="出題一覧"></ol>

      <div id="celebration" class="celebration" role="status" aria-live="polite" hidden>
        <div class="firework" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="celebration-copy">
          <span class="celebration-kicker">PERFECT</span>
          <strong>全問正解！</strong>
          <span>5問すべてに正解しました。</span>
        </div>
        <div class="firework firework-right" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>

      <footer class="panel-footer">
        <p id="progress" class="progress" aria-live="polite"></p>
        <button id="new-questions" class="new-button" type="button" hidden disabled>新しい問題</button>
      </footer>
    </section>
  </main>
</body>
</html>
